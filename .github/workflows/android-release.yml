# Build, sign and optionally publish Flutter Android app (AAB + APK).
# Triggers on tag push (v*.*.*) and manual dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # increase timeout for large builds
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: stable

      - name: Cache Flutter and Gradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies (flutter pub get)
        run: flutter pub get

      - name: Decode Android keystore (from ANDROID_KEYSTORE_BASE64)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        # Secrets used:
        # ANDROID_KEYSTORE_BASE64 - base64 of your upload-keystore.jks

      - name: Write android/key.properties for Gradle signing
        if: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF
        # Secrets used:
        # KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS

      - name: Run static analysis (optional)
        run: flutter analyze || true

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact to attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: app-release.aab
          path: release

      - name: Upload AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/build/app/outputs/bundle/release/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/octet-stream

      - name: Publish AAB to Google Play (internal) - optional
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.encrypted_sms_camera_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
        # Secrets used:
        # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON - service account JSON (whole content)

      - name: Done - summary
        run: |
          echo "Build finished. AAB and APK uploaded as workflow artifacts."
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "AAB also published to Google Play internal track."
          else
            echo "Google Play publish skipped (add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret to enable)."
          fi
